services:
  - type: web
    name: webbanai
    runtime: docker
    plan: free
    dockerfilePath: docker/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: DATA_DIR
        value: /app/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
